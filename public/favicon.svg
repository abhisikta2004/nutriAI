<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nutriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Leaf Glow Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6FFFA" />
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#nutriBg)" filter="url(#softShadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="26.5" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Stylized Nutrition Leaf / Bowl Motif -->
  <!-- Main Leaf -->
  <path d="M64 26 C82 26 98 42 98 64 C98 86 80 102 58 102 C44 102 30 94 30 78 C30 54 44 26 64 26 Z" 
        fill="url(#leafGrad)" />
        
  <!-- Leaf Vein & Curve -->
  <path d="M64 32 C58 48 54 68 34 84" 
        fill="none" 
        stroke="#059669" 
        stroke-width="4.5" 
        stroke-linecap="round" />
  
  <path d="M54 54 C62 58 72 58 84 52" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <path d="M46 70 C56 74 68 72 78 66" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- AI Intelligence Sparkles (Top Right) -->
  <path d="M96 22 L98.5 28.5 L105 31 L98.5 33.5 L96 40 L93.5 33.5 L87 31 L93.5 28.5 Z" 
        fill="url(#sparkGrad)" />

  <!-- Mini Sparkle (Bottom Left) -->
  <path d="M26 40 L27.5 44 L31.5 45.5 L27.5 47 L26 51 L24.5 47 L20.5 45.5 L24.5 44 Z" 
        fill="#FEF08A" />
</svg>
